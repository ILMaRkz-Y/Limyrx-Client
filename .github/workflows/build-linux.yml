name: Build Linux & macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.56.8)'
        required: true
        default: '0.56.8'

jobs:
  build-linux:
    name: Build Linux (AppImage + tar.xz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.3

      - name: Update version in package.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Building version: $VERSION"
          # We just use the version from repo's package.json, no need to modify

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Linux
        working-directory: xmcl-electron-app
        env:
          NODE_ENV: production
          RELEASE: true
        run: npx tsx build.ts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ github.event.inputs.version }}
          path: |
            xmcl-electron-app/build/output/xmcl-*-linux*
            xmcl-electron-app/build/output/app-*-linux*
            xmcl-electron-app/build/output/*.AppImage
            xmcl-electron-app/build/output/*.tar.xz
          if-no-files-found: warn

  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build macOS
        working-directory: xmcl-electron-app
        env:
          NODE_ENV: production
          RELEASE: true
        run: npx tsx build.ts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ github.event.inputs.version }}
          path: |
            xmcl-electron-app/build/output/xmcl-*-mac*
            xmcl-electron-app/build/output/app-*-mac*
            xmcl-electron-app/build/output/*.dmg
          if-no-files-found: warn
